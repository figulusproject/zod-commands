name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*/*"
  workflow_dispatch:
    inputs:
      workspace:
        description: "Package to publish (leave blank to publish all)"
        type: choice
        options:
          - ""
          - "zod-commands"
        default: ""

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == v*.*.*/* ]]; then
            npm publish --workspace="${GITHUB_REF_NAME#*/}" --access public
          elif [ -n "${{ inputs.workspace }}" ]; then
            npm publish --workspace="${{ inputs.workspace }}" --access public
          else
            npm publish --workspaces --access public
          fi
